<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPCH MedTrack V2 — Bio-Minimalist Studio | โรงพยาบาลพิษณุเวช พิจิตร</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Prompt:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <style>
    :root {
      --bg-alabaster: #f4f3ef;
      --surface-ivory: #ffffff;
      --jade-obsidian: #0c261f;
      --jade-deep: #133a2f;
      --jade-emerald: #0d9488;
      --mint-glow: #10b981;
      --gold-warm: #d97706;
      --ink-primary: #18181b;
      --ink-muted: #71717a;
      --border-stone: rgba(24, 24, 27, 0.08);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Prompt', 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-alabaster);
      color: var(--ink-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* Pre-loaded Admin V2 Frame */
    #adminFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
      opacity: 0;
      transform: scale(1.02);
      pointer-events: none;
      transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #adminFrame.is-active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    /* Architectural Split-Bento Portal Stage */
    #gateStage {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background:
        radial-gradient(circle at 12% 18%, rgba(16, 185, 129, 0.10) 0%, transparent 42%),
        radial-gradient(circle at 88% 82%, rgba(217, 119, 6, 0.08) 0%, transparent 42%),
        var(--bg-alabaster);
      transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #gateStage.is-exiting {
      opacity: 0;
      transform: scale(0.96) translateY(-20px);
      pointer-events: none;
    }

    /* Ambient Organic Rings */
    .orbital-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(19, 58, 47, 0.06);
      pointer-events: none;
    }
    .ring-1 { width: 580px; height: 580px; }
    .ring-2 { width: 860px; height: 860px; border-style: dashed; }

    /* Bento Studio Monolith */
    .bento-portal {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 780px;
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      background: var(--surface-ivory);
      border-radius: 36px;
      border: 1px solid var(--border-stone);
      box-shadow:
        0 32px 80px -20px rgba(12, 38, 31, 0.14),
        0 4px 16px -2px rgba(24, 24, 27, 0.04);
      overflow: hidden;
    }

    /* Left Column: Obsidian Jade Brand Sanctuary */
    .portal-brand-pane {
      background: linear-gradient(155deg, var(--jade-obsidian) 0%, var(--jade-deep) 100%);
      color: #ffffff;
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    .portal-brand-pane::before {
      content: '';
      position: absolute;
      right: -80px;
      bottom: -80px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.28) 0%, transparent 70%);
      pointer-events: none;
    }

    .brand-top-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #6ee7b7;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    .brand-center {
      margin: 36px 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
    }

    .logo-squircle {
      width: 96px;
      height: 96px;
      border-radius: 28px;
      background: #ffffff;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.28);
    }
    .logo-squircle img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-headline {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.02em;
      color: #ffffff;
    }
    .brand-sub {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.68);
      font-weight: 400;
      margin-top: -10px;
    }

    .brand-footer-symbols {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .mini-symbol-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.07);
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.85);
    }
    .mini-symbol-pill .material-icons-round {
      font-size: 15px;
      color: #34d399;
    }

    /* Right Column: Tactile Action Pods */
    .portal-action-pane {
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      background: var(--surface-ivory);
    }

    .pane-eyebrow {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--ink-muted);
      margin-bottom: 4px;
    }

    .studio-launch-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 22px 22px;
      border-radius: 24px;
      text-decoration: none;
      cursor: pointer;
      border: 1.5px solid #e4e4e7;
      background: #fafaf9;
      color: var(--ink-primary);
      font-family: inherit;
      text-align: left;
      transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .studio-launch-card:hover {
      transform: translateY(-3px);
      border-color: var(--jade-obsidian);
      background: #ffffff;
      box-shadow: 0 16px 32px -10px rgba(12, 38, 31, 0.14);
    }

    .studio-launch-card.primary-jade {
      background: var(--jade-obsidian);
      border-color: var(--jade-obsidian);
      color: #ffffff;
      box-shadow: 0 16px 32px -8px rgba(12, 38, 31, 0.28);
    }
    .studio-launch-card.primary-jade:hover {
      background: var(--jade-deep);
      border-color: var(--jade-deep);
      box-shadow: 0 22px 40px -8px rgba(12, 38, 31, 0.38);
    }

    .card-orb {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .primary-jade .card-orb {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }
    .secondary-ivory .card-orb {
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.25;
    }
    .card-caption {
      font-size: 12px;
      opacity: 0.68;
      margin-top: 3px;
    }

    .card-arrow {
      margin-left: auto;
      opacity: 0.5;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .studio-launch-card:hover .card-arrow {
      transform: translateX(4px);
      opacity: 1;
    }

    .v1-footer-link {
      margin-top: 12px;
      align-self: center;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-muted);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 999px;
      transition: all 0.2s;
    }
    .v1-footer-link:hover {
      background: #f4f4f5;
      color: var(--ink-primary);
    }

    @media (max-width: 720px) {
      #gateStage { padding: 16px; }
      .bento-portal {
        grid-template-columns: 1fr;
        border-radius: 28px;
      }
      .portal-brand-pane {
        padding: 32px 26px;
      }
      .brand-center {
        margin: 20px 0;
        flex-direction: row;
        align-items: center;
      }
      .logo-squircle {
        width: 68px;
        height: 68px;
        border-radius: 20px;
      }
      .brand-headline { font-size: 22px; }
      .portal-action-pane {
        padding: 28px 24px;
      }
    }
  </style>
</head>
<body>

  <iframe id="adminFrame" src="admin-v2.html" title="PPCH MedTrack V2 Studio"></iframe>

  <div id="gateStage">
    <div class="orbital-ring ring-1"></div>
    <div class="orbital-ring ring-2"></div>

    <main class="bento-portal">
      <!-- Left: Obsidian Jade Sanctuary -->
      <section class="portal-brand-pane">
        <div class="brand-top-tag">
          <span class="live-dot"></span>
          <span>MEDTRACK STUDIO • V2</span>
        </div>

        <div class="brand-center">
          <div class="logo-squircle">
            <img src="logo.png" alt="โรงพยาบาลพิษณุเวช พิจิตร">
          </div>
          <div>
            <h1 class="brand-headline">เครื่องมือแพทย์</h1>
            <p class="brand-sub">โรงพยาบาลพิษณุเวช พิจิตร</p>
          </div>
        </div>

        <div class="brand-footer-symbols">
          <span class="mini-symbol-pill"><span class="material-icons-round">check_circle</span> พร้อมใช้</span>
          <span class="mini-symbol-pill"><span class="material-icons-round">fact_check</span> ตรวจรายวัน</span>
          <span class="mini-symbol-pill"><span class="material-icons-round">bolt</span> Real-time</span>
        </div>
      </section>

      <!-- Right: Tactile Launch Cards -->
      <section class="portal-action-pane">
        <div class="pane-eyebrow">SELECT WORKSPACE</div>

        <button type="button" class="studio-launch-card primary-jade" onclick="handleEnter(event)">
          <div class="card-orb">
            <span class="material-icons-round" style="font-size: 26px;">space_dashboard</span>
          </div>
          <div>
            <div class="card-title">ศูนย์ควบคุม</div>
            <div class="card-caption">แดชบอร์ด • สถานะ • ซ่อมบำรุง</div>
          </div>
          <span class="material-icons-round card-arrow">arrow_forward</span>
        </button>

        <a href="eval-v2.html" class="studio-launch-card secondary-ivory">
          <div class="card-orb">
            <span class="material-icons-round" style="font-size: 26px;">fact_check</span>
          </div>
          <div>
            <div class="card-title">ตรวจเช็ครายวัน</div>
            <div class="card-caption">แบบฟอร์มสัญลักษณ์ • หน้างาน</div>
          </div>
          <span class="material-icons-round card-arrow">arrow_forward</span>
        </a>

        <a href="index.html" class="v1-footer-link">
          <span class="material-icons-round" style="font-size: 15px;">swap_horiz</span>
          <span>เปิดเวอร์ชันเดิม (V1 Classic)</span>
        </a>
      </section>
    </main>
  </div>

  <script>
    var isTransitioning = false;
    function handleEnter(e) {
      if (e) e.preventDefault();
      if (isTransitioning) return;
      isTransitioning = true;

      var gateStage = document.getElementById('gateStage');
      var adminFrame = document.getElementById('adminFrame');
      if (gateStage) gateStage.classList.add('is-exiting');
      if (adminFrame) adminFrame.classList.add('is-active');

      setTimeout(function () {
        if (gateStage) gateStage.style.display = 'none';
        try {
          window.history.pushState({ page: 'admin-v2' }, 'PPCH MedTrack V2', 'admin-v2.html');
        } catch (err) {}
        if (adminFrame && adminFrame.contentWindow) {
          try { adminFrame.contentWindow.focus(); } catch (err) {}
        }
      }, 550);
    }
  </script>
</body>
</html>
