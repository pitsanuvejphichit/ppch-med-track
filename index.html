<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเครื่องมือแพทย์ (PPCH MedTrack) | โรงพยาบาลพิษณุเวช พิจิตร</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Prompt:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <style>
    :root {
      /* Exact Phitsanuvej Phichit Logo Palette */
      --bg-porcelain: #f0f5fa;
      --surface-ivory: #ffffff;
      --logo-navy-deep: #183652;   /* Deep Slate-Steel Navy */
      --logo-navy-main: #26547c;   /* Outer Cross Petals & "พิษณุเวช" */
      --logo-sky-main: #56a8dc;    /* Inner 4 Squares & "พิจิตร" */
      --logo-sky-light: #7cc4f0;
      --logo-sky-tint: #ebf5fc;
      --logo-grey: #7d8790;        /* "โรงพยาบาล" */
      --ink-primary: #162a3d;
      --ink-muted: #64748b;
      --border-soft: rgba(38, 84, 124, 0.10);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Prompt', 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-porcelain);
      color: var(--ink-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* Pre-loaded Admin Frame */
    #adminFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
      opacity: 0;
      transform: scale(1.02);
      pointer-events: none;
      transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #adminFrame.is-active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    /* Architectural Split-Bento Portal Stage */
    #gateStage {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background:
        radial-gradient(circle at 14% 18%, rgba(86, 168, 220, 0.18) 0%, transparent 44%),
        radial-gradient(circle at 86% 82%, rgba(38, 84, 124, 0.12) 0%, transparent 44%),
        var(--bg-porcelain);
      transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #gateStage.is-exiting {
      opacity: 0;
      transform: scale(0.96) translateY(-20px);
      pointer-events: none;
    }

    /* Ambient Orbital Rings */
    .orbital-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(38, 84, 124, 0.07);
      pointer-events: none;
    }
    .ring-1 { width: 600px; height: 600px; }
    .ring-2 { width: 880px; height: 880px; border-style: dashed; }

    /* Bento Studio Monolith */
    .bento-portal {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 800px;
      display: grid;
      grid-template-columns: 1.08fr 1fr;
      background: var(--surface-ivory);
      border-radius: 36px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow:
        0 32px 80px -20px rgba(24, 54, 82, 0.18),
        0 4px 16px -2px rgba(24, 54, 82, 0.05);
      overflow: hidden;
    }

    /* Left Column: Phitsanuvej Slate-Steel Navy & Cerulean Sanctuary */
    .portal-brand-pane {
      background: linear-gradient(150deg, var(--logo-navy-deep) 0%, var(--logo-navy-main) 65%, #346d9e 100%);
      color: #ffffff;
      padding: 46px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    .portal-brand-pane::before {
      content: '';
      position: absolute;
      right: -70px;
      bottom: -70px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(86, 168, 220, 0.38) 0%, transparent 70%);
      pointer-events: none;
    }

    .brand-top-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(124, 196, 240, 0.30);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #bae6fd;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--logo-sky-light);
      box-shadow: 0 0 10px var(--logo-sky-light);
    }

    .brand-center {
      margin: 32px 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 22px;
    }

    /* Wide Rounded Showcase Pill for Horizontal Hospital Logo */
    .logo-showcase-pill {
      background: #ffffff;
      padding: 16px 24px;
      border-radius: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 20px 40px -10px rgba(12, 28, 44, 0.35),
        0 0 0 4px rgba(86, 168, 220, 0.22);
    }
    .logo-showcase-pill img {
      height: 64px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      display: block;
    }

    .brand-headline {
      font-size: 27px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.02em;
      color: #ffffff;
    }
    .brand-sub {
      font-size: 13.5px;
      color: #bae6fd;
      font-weight: 400;
      margin-top: -12px;
    }

    .brand-footer-symbols {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .mini-symbol-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.92);
    }
    .mini-symbol-pill .material-icons-round {
      font-size: 15px;
      color: var(--logo-sky-light);
    }

    /* Right Column: Tactile Action Pods */
    .portal-action-pane {
      padding: 46px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      background: var(--surface-ivory);
    }

    .pane-eyebrow {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--logo-grey);
      margin-bottom: 4px;
    }

    .studio-launch-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 22px 22px;
      border-radius: 24px;
      text-decoration: none;
      cursor: pointer;
      border: 1.5px solid #e2ecf5;
      background: #f8fbfe;
      color: var(--ink-primary);
      font-family: inherit;
      text-align: left;
      transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .studio-launch-card:hover {
      transform: translateY(-3px);
      border-color: var(--logo-sky-main);
      background: #ffffff;
      box-shadow: 0 16px 32px -10px rgba(38, 84, 124, 0.16);
    }

    .studio-launch-card.primary-navy {
      background: linear-gradient(135deg, var(--logo-navy-deep) 0%, var(--logo-navy-main) 100%);
      border-color: var(--logo-navy-main);
      color: #ffffff;
      box-shadow: 0 16px 32px -8px rgba(24, 54, 82, 0.32);
    }
    .studio-launch-card.primary-navy:hover {
      background: linear-gradient(135deg, var(--logo-navy-main) 0%, #316896 100%);
      box-shadow: 0 22px 40px -8px rgba(24, 54, 82, 0.42);
    }

    .card-orb {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .primary-navy .card-orb {
      background: rgba(86, 168, 220, 0.24);
      color: #7cc4f0;
      border: 1px solid rgba(124, 196, 240, 0.35);
    }
    .secondary-cerulean .card-orb {
      background: var(--logo-sky-tint);
      color: var(--logo-navy-main);
      border: 1px solid rgba(86, 168, 220, 0.35);
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.25;
    }
    .card-caption {
      font-size: 12px;
      opacity: 0.72;
      margin-top: 3px;
    }

    .card-arrow {
      margin-left: auto;
      opacity: 0.55;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .studio-launch-card:hover .card-arrow {
      transform: translateX(4px);
      opacity: 1;
    }

    @media (max-width: 720px) {
      #gateStage { padding: 16px; }
      .bento-portal {
        grid-template-columns: 1fr;
        border-radius: 28px;
      }
      .portal-brand-pane {
        padding: 30px 24px;
      }
      .brand-center {
        margin: 18px 0;
      }
      .logo-showcase-pill {
        padding: 12px 18px;
      }
      .logo-showcase-pill img {
        height: 50px;
      }
      .brand-headline { font-size: 22px; }
      .portal-action-pane {
        padding: 28px 24px;
      }
    }
  </style>
</head>
<body>

  <iframe id="adminFrame" data-src="admin.html" title="PPCH MedTrack Studio"></iframe>

  <div id="gateStage">
    <div class="orbital-ring ring-1"></div>
    <div class="orbital-ring ring-2"></div>

    <main class="bento-portal">
      <!-- Left: Phitsanuvej Slate-Steel Navy & Cerulean Sanctuary -->
      <section class="portal-brand-pane">
        <div class="brand-top-tag">
          <span class="live-dot"></span>
          <span>PPCH MEDTRACK STUDIO</span>
        </div>

        <div class="brand-center">
          <div class="logo-showcase-pill">
            <img src="logo.png" alt="โรงพยาบาลพิษณุเวช พิจิตร">
          </div>
          <div>
            <h1 class="brand-headline">ระบบเครื่องมือแพทย์</h1>
            <p class="brand-sub">โรงพยาบาลพิษณุเวช พิจิตร</p>
          </div>
        </div>

        <div class="brand-footer-symbols">
          <span class="mini-symbol-pill"><span class="material-icons-round">check_circle</span> พร้อมใช้</span>
          <span class="mini-symbol-pill"><span class="material-icons-round">fact_check</span> ตรวจรายวัน</span>
          <span class="mini-symbol-pill"><span class="material-icons-round">bolt</span> Real-time</span>
        </div>
      </section>

      <!-- Right: Tactile Launch Cards -->
      <section class="portal-action-pane">
        <div class="pane-eyebrow">SELECT WORKSPACE</div>

        <button type="button" class="studio-launch-card primary-navy" onclick="handleEnter(event)">
          <div class="card-orb">
            <span class="material-icons-round" style="font-size: 26px;">space_dashboard</span>
          </div>
          <div>
            <div class="card-title">ศูนย์ควบคุม</div>
            <div class="card-caption">แดชบอร์ด • สถานะ • ซ่อมบำรุง</div>
          </div>
          <span class="material-icons-round card-arrow">arrow_forward</span>
        </button>

        <a href="eval.html" class="studio-launch-card secondary-cerulean">
          <div class="card-orb">
            <span class="material-icons-round" style="font-size: 26px;">fact_check</span>
          </div>
          <div>
            <div class="card-title">ตรวจเช็ครายวัน</div>
            <div class="card-caption">แบบฟอร์มสัญลักษณ์ • หน้างาน</div>
          </div>
          <span class="material-icons-round card-arrow">arrow_forward</span>
        </a>
      </section>
    </main>
  </div>

  <script>
    var isTransitioning = false;

    // Preload the admin studio only after the portal has painted & the browser is idle
    function ensureAdminFrameLoaded() {
      var f = document.getElementById('adminFrame');
      if (f && !f.getAttribute('src')) f.setAttribute('src', f.getAttribute('data-src') || 'admin.html');
    }
    window.addEventListener('load', function () {
      if ('requestIdleCallback' in window) {
        requestIdleCallback(ensureAdminFrameLoaded, { timeout: 1500 });
      } else {
        setTimeout(ensureAdminFrameLoaded, 800);
      }
    });

    function handleEnter(e) {
      if (e) e.preventDefault();
      if (isTransitioning) return;
      isTransitioning = true;
      ensureAdminFrameLoaded();

      var gateStage = document.getElementById('gateStage');
      var adminFrame = document.getElementById('adminFrame');
      if (gateStage) gateStage.classList.add('is-exiting');
      if (adminFrame) adminFrame.classList.add('is-active');

      setTimeout(function () {
        if (gateStage) gateStage.style.display = 'none';
        try {
          window.history.pushState({ page: 'admin' }, 'PPCH MedTrack', 'admin.html');
        } catch (err) {}
        if (adminFrame && adminFrame.contentWindow) {
          try { adminFrame.contentWindow.focus(); } catch (err) {}
        }
      }, 550);
    }
  </script>
</body>
</html>
